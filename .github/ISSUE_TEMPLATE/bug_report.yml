name: Bug report
description: Something in FivePRS isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go on duty at Mission Row
        2. Open the terminal
        3. ...
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics
      description: Run `fiveprs_diag` in the server console and paste the output.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any `[FivePRS]` errors or warnings from the server console, and from F8 in game if it's a client problem.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else

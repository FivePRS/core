<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FivePRS</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="cards.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="terminal" hidden>
    <div class="terminal-screen">
      <div class="lightbar" aria-hidden="true"></div>
      <img id="wallpaper" class="wallpaper" alt="">

      <header class="statusbar">
        <div class="statusbar-side">
          <span id="sb-identity" class="sb-identity"></span>
          <span id="sb-status" class="sb-status" hidden></span>
        </div>
        <img id="brand-logo" class="brand-logo" alt="FivePRS">
        <div class="statusbar-side statusbar-end">
          <span id="clock" class="clock"></span>
          <button id="close" class="icon-button" type="button" aria-label="Close">&times;</button>
        </div>
      </header>

      <section id="home" class="home">
        <div class="home-side">
          <div>
            <p id="home-time" class="home-time"></p>
            <p id="home-date" class="home-date"></p>
          </div>

          <div id="home-offer" class="widget" hidden>
            <div class="widget-head">
              <span class="eyebrow">Incoming call</span>
              <span id="home-offer-countdown" class="mono"></span>
            </div>
            <p id="home-offer-title" class="widget-title"></p>
            <p id="home-offer-detail" class="widget-detail"></p>
            <div class="widget-track" aria-hidden="true"><div id="home-offer-bar" class="widget-bar"></div></div>
            <div class="widget-actions">
              <button type="button" class="button primary" data-home="accept">Accept <span class="widget-key">Y</span></button>
              <button type="button" class="button" data-home="decline">Decline <span class="widget-key">N</span></button>
            </div>
          </div>

          <div id="home-shift" class="widget widget-stats" hidden>
            <div><p class="eyebrow">Units</p><p id="home-units" class="widget-stat-value"></p></div>
            <div><p class="eyebrow">Calls</p><p id="home-calls" class="widget-stat-value"></p></div>
            <div><p class="eyebrow">Shift</p><p id="home-shift-time" class="widget-stat-value"></p></div>
          </div>
        </div>
        <div id="app-grid" class="app-grid"></div>
      </section>

      <div id="app-window" class="app-window" hidden>
        <header class="app-bar">
          <button id="home-button" class="button small" type="button">&#8249; Home</button>
          <span id="app-icon" class="app-bar-icon"></span>
          <p id="app-title" class="app-title"></p>
        </header>

        <main class="app-body">
          <section id="tab-ext" class="tab ext">
            <div id="ext-view" class="ext-view"></div>
            <iframe id="ext-frame" class="ext-frame" title="App" hidden></iframe>
          </section>
        </main>
      </div>
    </div>
    <button id="home-key" class="home-key" type="button" aria-label="Home"></button>
  </div>

  <aside id="card-overlay" class="card-overlay" hidden>
    <p id="card-caption" class="card-overlay-caption"></p>
    <div id="card-slot"></div>
  </aside>

  <aside id="creator" class="creator" hidden>
    <div class="lightbar" aria-hidden="true"></div>
    <header class="creator-head">
      <p class="panel-title">Character appearance</p>
      <h1 id="creator-name" class="creator-name"></h1>
      <nav id="creator-tabs" class="creator-tabs"></nav>
    </header>
    <div id="creator-body" class="creator-body"></div>
    <footer class="creator-foot">
      <div class="creator-view">
        <button type="button" class="button small" data-focus="face">Face</button>
        <button type="button" class="button small" data-focus="body">Body</button>
        <button type="button" class="button small" data-focus="legs">Legs</button>
        <button type="button" class="button small" data-rotate="-30" aria-label="Rotate left">&#10226;</button>
        <button type="button" class="button small" data-rotate="30" aria-label="Rotate right">&#10227;</button>
      </div>
      <div class="creator-actions">
        <button id="creator-cancel" type="button" class="button">Cancel</button>
        <button id="creator-save" type="button" class="button primary">Save</button>
      </div>
    </footer>
  </aside>

  <aside id="menu" class="cmenu" hidden>
    <div class="lightbar" aria-hidden="true"></div>
    <header class="cmenu-head">
      <span id="menu-icon" class="dept-slot small"></span>
      <div>
        <p id="menu-title" class="cmenu-title"></p>
        <p id="menu-subtitle" class="cmenu-subtitle"></p>
      </div>
    </header>
    <ol id="menu-items" class="cmenu-items"></ol>
    <footer class="cmenu-foot">
      <span><span class="key">&uarr;&darr;</span>Move</span>
      <span><span class="key">Enter</span>Select</span>
      <span><span class="key">Bksp</span><span id="menu-back"></span></span>
    </footer>
  </aside>

  <script src="kit.js"></script>
  <script src="cards.js"></script>
  <script src="common.js"></script>
  <script src="appview.js"></script>
  <script src="menu.js"></script>
  <script src="creator.js"></script>
  <script src="app.js"></script>
</body>
</html>

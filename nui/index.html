<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FivePRS MDT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="entry" class="entry" hidden>
    <div class="entry-card" role="dialog" aria-labelledby="entry-title">
      <div class="lightbar" aria-hidden="true"></div>

      <p class="panel-title">FivePRS</p>
      <h1 id="entry-title" class="entry-title"></h1>

      <div class="entry-profile">
        <div>
          <p class="entry-label">Rank</p>
          <p id="entry-rank" class="entry-rank"></p>
        </div>
        <div class="entry-xp">
          <div class="entry-xp-head">
            <p class="entry-label">Experience</p>
            <p id="entry-xp" class="entry-label"></p>
          </div>
          <div class="xp-track" aria-hidden="true"><div id="entry-xp-bar" class="xp-bar"></div></div>
        </div>
      </div>

      <p class="panel-title entry-section">Department</p>
      <div id="entry-departments" class="option-row"></div>

      <p id="entry-agency-title" class="panel-title entry-section">Agency</p>
      <div id="entry-agencies" class="option-grid"></div>

      <p id="entry-empty" class="entry-message" hidden>No departments are available to you on this server.</p>
      <p id="entry-error" class="entry-message entry-error" hidden></p>

      <div class="entry-actions">
        <button id="entry-civilian" type="button" class="button">Continue as civilian</button>
        <button id="entry-enter" type="button" class="button primary">Go on duty</button>
      </div>
    </div>
  </div>

  <div id="mdt" class="mdt" hidden>
    <header class="mdt-header">
      <div class="lightbar" aria-hidden="true"></div>
      <div class="brand">
        <span class="wordmark">five<span class="red">p</span><span class="blue">rs</span></span>
        <span class="brand-label">Mobile Data Terminal</span>
      </div>
      <div class="header-meta">
        <span id="clock" class="clock"></span>
        <button id="close" class="icon-button" type="button" aria-label="Close MDT">&times;</button>
      </div>
    </header>

    <main class="mdt-body">
      <aside class="panel self">
        <p class="panel-title">My unit</p>
        <p id="self-callsign" class="callsign"></p>
        <p id="self-name" class="muted"></p>
        <p id="self-agency" class="muted"></p>

        <dl class="facts">
          <div><dt>Status</dt><dd id="self-status"></dd></div>
          <div><dt>Area</dt><dd id="self-territory"></dd></div>
          <div><dt>Assigned call</dt><dd id="self-call"></dd></div>
        </dl>

        <p class="panel-title">Set status</p>
        <div class="status-buttons">
          <button type="button" class="button" data-status="Available">Available</button>
          <button type="button" class="button" data-status="Busy">Busy</button>
        </div>
        <p id="status-hint" class="hint"></p>
      </aside>

      <section class="panel calls">
        <div class="panel-head">
          <p class="panel-title">Active calls</p>
          <span id="call-count" class="count"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Call</th><th>Type</th><th>Area</th><th>Units</th><th></th></tr>
            </thead>
            <tbody id="calls"></tbody>
          </table>
          <p id="calls-empty" class="empty" hidden>No active calls.</p>
        </div>
      </section>

      <section class="panel units">
        <div class="panel-head">
          <p class="panel-title">Units</p>
          <span id="unit-count" class="count"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Callsign</th><th>Officer</th><th>Area</th><th>Status</th></tr>
            </thead>
            <tbody id="units"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="mdt.js"></script>
  <script src="entry.js"></script>
</body>
</html>
